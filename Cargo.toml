[package]
name = "ws-relay"
version = "0.1.0"
edition = "2024"
description = "Relay Websocket connections."
authors = ["zkonge <zkonge@outlook.com>"]
readme = "README.md"
homepage = "https://github.com/zkonge/ws-relay"
repository = "https://github.com/zkonge/ws-relay"
license-file = "LICENSE"

[dependencies]
tokio = { version = "1.47.1", features = ["macros"], default-features = false }
futures-util = { version = "0.3", default-features = false }
axum = { version = "0.8.6", features = ["ws", "http1"], default-features = false }
dashmap = { version = "6.1.0", default-features = false }

[profile.release]
strip = true
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
